<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Arcade</title>
<meta name="description" content="Free browser games — fast, addictive, no downloads.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;0,900;1,900&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>

<header class="top">
  <a class="logo" href="index.html" aria-label="Nova Arcade home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2a8a"/></linearGradient></defs><path d="M16 2 30 16 16 30 2 16Z" fill="none" stroke="url(#lg)" stroke-width="3"/><path d="M16 9 23 16 16 23 9 16Z" fill="url(#lg)"/></svg>
    <span>NOVA<b>ARCADE</b></span>
  </a>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
    <kbd>/</kbd>
  </label>
  <button class="pill" id="random" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
    <span>Random</span>
  </button>
</header>

<main>
  <section class="hero" id="hero" aria-label="Featured game"></section>

  <section class="row" id="recentWrap" hidden>
    <h2>Jump back in</h2>
    <div class="recent" id="recent"></div>
  </section>

  <section class="row">
    <div class="rowhead">
      <h2 id="gridTitle">All games</h2>
      <div class="chips" id="chips" role="tablist"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No games match that search.</p>
  </section>
</main>

<footer class="foot">
  <div><b id="statPlays">0</b> games played on this device &middot; <b id="statGames">0</b> games in the arcade</div>
  <div class="tips">In any game: <kbd>P</kbd> pause &middot; <kbd>M</kbd> mute &middot; <kbd>F</kbd> fullscreen</div>
</footer>

<script src="assets/games.js"></script>
<script src="assets/portal.js"></script>
</body>
</html>
